name: Build source

# Rebuilds source.json from the latest release of each of Rashid's public
# repositories, so adding one address in RaDown lists every app and shows an
# update whenever a new release is published.

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-source
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source.json
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN || github.token }}
        run: python3 tools/build_source.py

      - name: Commit if it changed
        run: |
          if [ -z "$(git status --porcelain source.json icons)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json icons
          git commit -m "Update the source"
          git push
